
spring.application.name=urbanserve-payment

# Load local secrets from a git-ignored .env file in the project root, if present.
# Copy .env.example to .env and fill in your own keys. Never commit .env.
spring.config.import=optional:file:.env[.properties]

# Razorpay configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Private token used by the Booking API to call the Payment Service.
payment.internal-token=${PAYMENT_INTERNAL_TOKEN:}

# Flyway creates the schema. Hibernate checks that it matches the Java entity.
spring.jpa.hibernate.ddl-auto=validate